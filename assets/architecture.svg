<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">

  <!-- page background -->
  <rect x="0" y="0" width="900" height="560" rx="12" fill="#0d1117"/>

  <!-- ============ server.py card ============ -->
  <rect x="24" y="24" width="852" height="88" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <!-- server icon (two stacked bars with dots) -->
  <g transform="translate(48, 46)">
    <rect x="0" y="0" width="26" height="10" rx="2" fill="none" stroke="#58a6ff" stroke-width="1.6"/>
    <circle cx="5" cy="5" r="1.4" fill="#58a6ff"/>
    <rect x="0" y="14" width="26" height="10" rx="2" fill="none" stroke="#58a6ff" stroke-width="1.6"/>
    <circle cx="5" cy="19" r="1.4" fill="#58a6ff"/>
  </g>
  <text x="88" y="58" font-size="17" font-weight="700" fill="#f0f6fc">server.py</text>
  <text x="88" y="80" font-size="13" fill="#8b949e">starlette + uvicorn — listens on 0.0.0.0:$PORT</text>

  <!-- ============ routes label ============ -->
  <text x="24" y="140" font-size="13" fill="#8b949e">routes</text>

  <!-- ============ routes card ============ -->
  <rect x="24" y="150" width="852" height="210" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- row 1: /setup -->
  <g transform="translate(48, 178)">
    <path d="M2 8 v-3 a5 5 0 0 1 10 0 v3 M0 8 h14 v10 h-14 z" fill="none" stroke="#c9d1d9" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <text x="88" y="192" font-size="14" font-family="ui-monospace, monospace" font-weight="600" fill="#f0f6fc">/setup</text>
  <text x="88" y="211" font-size="12" fill="#8b949e">admin panel</text>
  <rect x="748" y="182" width="104" height="26" rx="13" fill="#3d2d13" stroke="#9e6a03" stroke-width="1"/>
  <text x="800" y="199" text-anchor="middle" font-size="11" font-weight="600" fill="#e3a008">auth required</text>
  <line x1="24" y1="220" x2="876" y2="220" stroke="#30363d" stroke-width="1"/>

  <!-- row 2: /setup/api/* -->
  <text x="48" y="252" font-size="10" font-weight="700" fill="#8b949e">API</text>
  <text x="88" y="252" font-size="14" font-family="ui-monospace, monospace" font-weight="600" fill="#f0f6fc">/setup/api/*</text>
  <text x="88" y="271" font-size="12" fill="#8b949e">rest api — config, status, logs, gateway</text>
  <line x1="24" y1="290" x2="876" y2="290" stroke="#30363d" stroke-width="1"/>

  <!-- row 3: / and /* -->
  <g transform="translate(48, 308)">
    <path d="M0 6 h10 M6 2 l4 4 -4 4" fill="none" stroke="#c9d1d9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="88" y="322" font-size="14" font-family="ui-monospace, monospace" font-weight="600" fill="#f0f6fc">/ and /*</text>
  <text x="88" y="341" font-size="12" fill="#8b949e">reverse proxy to Hermes dashboard</text>

  <!-- ============ Hermes label ============ -->
  <text x="24" y="398" font-size="13" fill="#8b949e">Hermes</text>

  <!-- ============ dashboard card ============ -->
  <rect x="24" y="408" width="414" height="128" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <g transform="translate(48, 432)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="none" stroke="#c9d1d9" stroke-width="1.5"/>
    <rect x="12" y="0" width="8" height="8" rx="2" fill="none" stroke="#c9d1d9" stroke-width="1.5"/>
    <rect x="0" y="12" width="8" height="8" rx="2" fill="none" stroke="#c9d1d9" stroke-width="1.5"/>
    <rect x="12" y="12" width="8" height="8" rx="2" fill="none" stroke="#c9d1d9" stroke-width="1.5"/>
  </g>
  <text x="80" y="444" font-size="15" font-weight="700" fill="#f0f6fc">dashboard</text>
  <text x="48" y="472" font-size="12" fill="#8b949e">127.0.0.1:9119</text>
  <rect x="48" y="490" width="112" height="26" rx="13" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="104" y="507" text-anchor="middle" font-size="11" font-weight="600" fill="#c9d1d9">loopback only</text>

  <!-- ============ gateway card ============ -->
  <rect x="462" y="408" width="414" height="128" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <g transform="translate(486, 432)">
    <path d="M0 8 L20 0 L12 16 L9 9 Z" fill="none" stroke="#c9d1d9" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="518" y="444" font-size="15" font-weight="700" fill="#f0f6fc">gateway</text>
  <text x="486" y="472" font-size="12" fill="#8b949e">telegram, discord, etc.</text>
  <rect x="486" y="490" width="126" height="26" rx="13" fill="#0f2b1d" stroke="#238636" stroke-width="1"/>
  <text x="549" y="507" text-anchor="middle" font-size="11" font-weight="600" fill="#3fb950">auto-restarted</text>

</svg>